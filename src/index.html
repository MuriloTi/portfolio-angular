<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Murilo Barros Cardoso · Engenheiro de Software Full-Stack</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Apply the saved/OS theme before first paint to avoid a flash of the wrong theme. -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="canonical" href="https://muriloti.github.io/portfolio-angular/" />
    <meta name="theme-color" content="#FAF8FF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F0B1A" media="(prefers-color-scheme: dark)" />
    <!-- Language-dependent tags (description, og:title, og:description, og:locale, twitter:*)
         are set by LanguageService, so the prerendered HTML already has them in pt-BR. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Murilo Barros Cardoso" />
    <meta property="og:url" content="https://muriloti.github.io/portfolio-angular/" />
    <meta
      property="og:image"
      content="https://muriloti.github.io/portfolio-angular/images/profile.jpeg"
    />
    <meta property="og:image:width" content="1086" />
    <meta property="og:image:height" content="1448" />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:image"
      content="https://muriloti.github.io/portfolio-angular/images/profile.jpeg"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
